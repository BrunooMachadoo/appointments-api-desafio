default:
  tags:
    - develop

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

image: maven:3.9.9-eclipse-temurin-21

stages:
  - build
  - dependency-check
  - image-scan
  - pentest
  - sonar

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - .sonar/cache

build:
  stage: build
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

dependency-check:
  stage: dependency-check
  script:
    - mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
      - target/dependency-check-report.xml
    expire_in: 7 days
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

trivy-image-scan:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - mkdir -p reports/trivy
    - trivy image --severity HIGH,CRITICAL --format json -o reports/trivy/maven.json maven:3.9.9-eclipse-temurin-21
    - trivy image --severity HIGH,CRITICAL --format json -o reports/trivy/python.json python:3.12-alpine
    - trivy image --severity HIGH,CRITICAL --format json -o reports/trivy/zap.json zaproxy/zap-stable
  artifacts:
    when: always
    paths:
      - reports/trivy/
    expire_in: 7 days
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

sqlmap:
  stage: pentest
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git python3 py3-pip
    - git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git
  script:
    - mkdir -p reports/sqlmap
    - >
      python sqlmap/sqlmap.py
      -u "http://appointments-api:8080/api/appointments?id=1"
      --batch
      --level=5
      --risk=3
      --crawl=3
      --forms
      --threads=10
      --output-dir=reports/sqlmap
  artifacts:
    when: always
    paths:
      - reports/sqlmap/
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

owasp-zap:
  stage: pentest
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  script:
    - mkdir -p reports/zap
    - zap-baseline.py -t http://appointments-api:8080 -r reports/zap/zap-report.html
  artifacts:
    when: always
    paths:
      - reports/zap/
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

sonarqube-check:
  stage: sonar
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - >
      mvn
      org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar
      -Dsonar.projectKey=root_appointments-api-desafio_AaBqSoA5ik7xCKHxUh_2
      -Dsonar.host.url=http://sonarqube:9000
      -Dsonar.token=$SONAR_TOKEN
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'